# Builds the release APKs (arm64-v8a, armeabi-v7a, x86_64 and universal) and publishes them as a
# GitHub Release. Runs for a pushed `v*` tag, or by hand with a tag name, in which case the tag is
# created on the chosen ref by the release itself. This is the only workflow with write access, and
# only to releases (docs/DECISIONS.md D-21); CI stays read-only.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or reuse, e.g. v0.1.0"
        required: true
        type: string
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  release:
    name: Build and publish APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the tag and version
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${INPUT_TAG}"
          fi
          case "$tag" in
            v[0-9]*) ;;
            *) echo "tag must look like v0.1.0, got '$tag'"; exit 1 ;;
          esac
          version="${tag#v}"
          declared=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -1)
          if [ "$declared" != "$version" ]; then
            echo "versionName in app/build.gradle.kts is '$declared' but the tag says '$version'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install platform and build tools
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true; sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@b9bee63ef481cc545e4517ec730544a4d8b1dfa0 # v6.4.0
        with:
          cache-read-only: true

      - name: Prepare the signing key (only when the secrets exist)
        # The keystore never enters the repository: it is decoded into the runner's temp directory and
        # handed to Gradle through environment variables. Without the secrets the build falls back to
        # the debug key, which is documented in the release notes (REQ-6).
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SUBLEARN_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64}" ]; then
            printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SUBLEARN_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "SUBLEARN_SIGNING=release" >> "$GITHUB_ENV"
            echo "signing=release key from secrets" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "SUBLEARN_SIGNING=debug" >> "$GITHUB_ENV"
            echo "signing=debug key (no SUBLEARN_KEYSTORE_BASE64 secret)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build the release APKs
        shell: bash
        env:
          SUBLEARN_KEYSTORE_PASSWORD: ${{ secrets.SUBLEARN_KEYSTORE_PASSWORD }}
          SUBLEARN_KEY_ALIAS: ${{ secrets.SUBLEARN_KEY_ALIAS }}
          SUBLEARN_KEY_PASSWORD: ${{ secrets.SUBLEARN_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Collect and name the APKs
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release-apks"
          mkdir -p "$out"
          found=0
          for abi in universal arm64-v8a armeabi-v7a x86_64; do
            src="app/build/outputs/apk/release/app-${abi}-release.apk"
            if [ -f "$src" ]; then
              cp "$src" "$out/SubLearn-${TAG}-${abi}.apk"
              found=$((found + 1))
            else
              echo "::error::expected $src was not produced"
            fi
          done
          [ "$found" -eq 4 ] || { ls -R app/build/outputs/apk || true; exit 1; }
          (cd "$out" && sha256sum *.apk > "SubLearn-${TAG}-SHA256SUMS.txt")
          # The notes state how the files were actually signed instead of hedging (REQ-6).
          python3 tools/release_notes.py "${TAG#v}" "$out" CHANGELOG.md \
            --signing "${SUBLEARN_SIGNING:-unknown}" --commit "$GITHUB_SHA" \
            --build-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the APKs as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SubLearn-${{ steps.meta.outputs.tag }}-apks
          path: ${{ runner.temp }}/release-apks/*
          if-no-files-found: error
          retention-days: 30

      - name: Create or update the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          if [ "${PRERELEASE}" = "true" ]; then flags+=(--prerelease); fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP"/release-apks/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$RUNNER_TEMP"/release-apks/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SubLearn $TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              "${flags[@]}"
          fi
          echo "Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the failure report as a check run
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report="$RUNNER_TEMP/failure-report.md"
          python3 tools/ci_failure_report.py "$RUNNER_TEMP/gradle.log" . > "$report" || echo "report generation failed" > "$report"
          gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name="Release failure report" \
            -f head_sha="$GITHUB_SHA" \
            -f status=completed \
            -f conclusion=failure \
            -f "details_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f "output[title]=Release build failed (run $GITHUB_RUN_ID)" \
            -f "output[summary]=Compiler errors, failed tasks and the log tail from this run." \
            -F "output[text]=@$report" \
            >/dev/null || echo "::warning::the failure report could not be published as a check run"

      - name: Upload the build log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-gradle-log
          path: ${{ runner.temp }}/gradle.log
          if-no-files-found: ignore
          retention-days: 7
