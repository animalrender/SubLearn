# Every push and PR: static checks, unit tests, lint, debug and release APK artifacts.
# The workflow is the build authority for agents working in a sandbox without a JVM (see AGENTS.md).
name: CI

on:
  push:
    branches: ["main", "phase/**", "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build, test, lint
    runs-on: ubuntu-latest
    # 60, not 30: on a branch with a cold Gradle cache (read-only on arena/* branches) the first
    # full assemble ran past 30 minutes, and the job was cancelled before it could report errors.
    timeout-minutes: 60
    permissions:
      contents: read
      # Only for the failure report below: a check run is the one place a sandboxed agent can read a
      # long failure text from, because the log and artifact hosts are not reachable from there.
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history and every tag: the version of a `main` build is computed from the
          # release tags (tools/next_version.py), so a shallow clone would name every build 3.0.0.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install platform and build tools
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true; sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@b9bee63ef481cc545e4517ec730544a4d8b1dfa0 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Static checks
        run: |
          python3 tools/check_sources.py core app feature tools
          python3 tools/check_symbols.py
          python3 tools/check_deps.py
          python3 tools/check_resources.py core app feature
          python3 tools/check_docs.py --repo-root .
          python3 tools/check_schema.py --repo-root .
          python3 tools/check_catalog.py --repo-root .
          python3 tools/check_workflows.py --repo-root .
          python3 -m unittest tools/test_update_catalog.py
          python3 -m unittest tools/test_check_catalog.py
          python3 -m unittest tools/test_next_version.py
          python3 -m unittest tools/lexicon_builder/test_lexicon_builder.py

      - name: Work out the version this build carries
        # The same rule the release workflow uses (tools/next_version.py): on `main` the build
        # carries the version that is about to be released, everywhere else it carries the
        # rolling dev version. The file written here is what the release workflow reads to decide
        # whether it may publish these exact APKs or has to build them again (D-82).
        id: version
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$BRANCH" = "main" ]; then
            version=$(python3 tools/next_version.py)
          else
            shortsha=$(echo "$GITHUB_SHA" | head -c 7)
            version="0.0.0-dev-${BRANCH//\//-}+${shortsha}"
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "version: $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Assemble, unit test, lint
        # --continue so a broken module does not hide the errors of the modules after it: one run
        # should produce the whole list of compile errors, since each CI round trip is slow here.
        shell: bash
        env:
          SUBLEARN_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleRelease test lintDebug assembleDebugAndroidTest \
            --continue --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Record the version in the artifact
        # The release workflow publishes these APKs unchanged, so it has to be able to check that
        # they carry the version it is about to publish. A build whose version does not match is
        # rebuilt rather than published under the wrong number.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/build/outputs/apk/release
          printf '%s\n' "${{ steps.version.outputs.name }}" > app/build/outputs/apk/release/version.txt

      - name: Report the failure as annotations
        # The agent sandbox cannot read the Actions log host, so the interesting lines are published as
        # check-run annotations, which are readable through the REST API. Deliberately noisy: a build
        # that fails for a new reason still shows the reason.
        if: failure()
        shell: bash
        run: |
          log="$RUNNER_TEMP/gradle.log"
          if [ ! -f "$log" ]; then
            echo "::error::no gradle log was produced"
            exit 0
          fi
          # Compiler errors first (file:line:line: message), then the reason block of every failed
          # task, with the JVM stack frames filtered out. Gradle prints the useful text only inside
          # "* What went wrong", so summary lines alone are not enough to fix a build remotely.
          {
            grep -E -A 3 "^e: " "$log" | head -180
            grep -E "^> Task .* FAILED" "$log" | head -40
            python3 tools/ci_report.py "$log"
          } | head -140 | sed 's/%/%25/g; s/"/%22/g' | while IFS= read -r line; do
            echo "::error::${line:0:280}"
          done
          echo "--- last lines ---"
          tail -25 "$log" | sed 's/%/%25/g; s/"/%22/g' | while IFS= read -r line; do
            echo "::warning::${line:0:300}"
          done

      - name: Publish the full failure report as a check run
        # Annotations stop after ten per step; the check-run text carries the whole picture (every
        # compiler error, failed task, failing test and lint error) and is readable with
        # `gh api repos/<owner>/<repo>/commits/<sha>/check-runs`.
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          report="$RUNNER_TEMP/failure-report.md"
          python3 tools/ci_failure_report.py "$RUNNER_TEMP/gradle.log" . > "$report" || echo "report generation failed" > "$report"
          gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name="Gradle failure report" \
            -f head_sha="$HEAD_SHA" \
            -f status=completed \
            -f conclusion=failure \
            -f "details_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f "output[title]=Gradle failed (run $GITHUB_RUN_ID)" \
            -f "output[summary]=Compiler errors, failed tasks, failing tests and lint errors from this run." \
            -F "output[text]=@$report" \
            >/dev/null || echo "::warning::the failure report could not be published as a check run"

      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradle-log
          path: ${{ runner.temp }}/gradle.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SubLearn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APKs
        # The same four files the release workflow publishes, so a shrunk build is checked on every
        # push, plus the version file the release workflow reads before publishing them.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SubLearn-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/version.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-reports
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/lint-results*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: "**/build/test-results/**/*.xml"
          if-no-files-found: warn
          retention-days: 14
