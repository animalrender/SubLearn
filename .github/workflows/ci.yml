# Every push and PR: static checks, unit tests, lint, a debug APK artifact.
# The workflow is the build authority for agents working in a sandbox without a JVM (see AGENTS.md).
name: CI

on:
  push:
    branches: ["main", "phase/**", "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install platform and build tools
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true; sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@b9bee63ef481cc545e4517ec730544a4d8b1dfa0 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: License and hygiene guard
        run: |
          set -e
          # LICENSE SAFETY (docs/DECISIONS.md): no third-party databases, model files or signing
          # material may ever enter the repository. This fails the build instead of trusting review.
          bad=$(git ls-files | grep -Ei '\.(sqlite|sqlite3|db|bipe|jks|keystore|p12|keystore.properties)$|^local\.properties$|fastdic_plain' || true)
          if [ -n "$bad" ]; then
            echo "Forbidden files are tracked:"
            echo "$bad"
            exit 1
          fi
          grep -rniE "(AIza[0-9A-Za-z_-]{30,}|sk-[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)" \
            --include='*.kt' --include='*.xml' --include='*.kts' --include='*.json' . \
            && { echo "A literal API key or private key appeared in the source tree."; exit 1; } || true

      - name: Static checks
        run: |
          python3 tools/check_sources.py core app feature tools
          python3 tools/check_symbols.py
          python3 tools/check_deps.py

      - name: Assemble, unit test, lint
        # --continue so a broken module does not hide the errors of the modules after it: one run
        # should produce the whole list of compile errors, since each CI round trip is slow here.
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug test lintDebug assembleDebugAndroidTest \
            --continue --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Report the failure as annotations
        # The agent sandbox cannot read the Actions log host, so the interesting lines are published as
        # check-run annotations, which are readable through the REST API. Deliberately noisy: a build
        # that fails for a new reason still shows the reason.
        if: failure()
        shell: bash
        run: |
          log="$RUNNER_TEMP/gradle.log"
          if [ ! -f "$log" ]; then
            echo "::error::no gradle log was produced"
            exit 0
          fi
          # Compiler errors first (file:line:line: message), then the reason block of every failed
          # task, with the JVM stack frames filtered out. Gradle prints the useful text only inside
          # "* What went wrong", so summary lines alone are not enough to fix a build remotely.
          {
            grep -E "^e: |^w: .*(deprecat|unused)" "$log" | head -60
            grep -E "^> Task .* FAILED" "$log" | head -40
            grep -A 16 -E "^\* What went wrong" "$log" | grep -vE "^\s+at |^\s*\* Try|^[0-9]+ \*|^(--)$" | head -120
          } | head -140 | sed 's/%/%25/g; s/"/%22/g' | while IFS= read -r line; do
            echo "::error::${line:0:280}"
          done
          echo "--- last lines ---"
          tail -25 "$log" | sed 's/%/%25/g; s/"/%22/g' | while IFS= read -r line; do
            echo "::warning::${line:0:300}"
          done

      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradle-log
          path: ${{ runner.temp }}/gradle.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SubLearn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-reports
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/lint-results*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: "**/build/test-results/**/*.xml"
          if-no-files-found: warn
          retention-days: 14
