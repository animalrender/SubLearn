name: Build Lexicon Pack v2

on:
  push:
    branches: ["arena/**"]
    paths:
      - "tools/lexicon_builder/**"
      - ".github/workflows/build-lexicon-pack.yml"
  workflow_dispatch:
    inputs:
      source_url:
        description: "URL to main_db.sqlite (or sample.sqlite fallback)"
        required: false
        default: "https://github.com/melonityhub/dictionaryproject/releases/download/v1.0.1/main_db.sqlite"
      publish_release:
        description: "Upload built packs to packs-v2.0.0 GitHub Release"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  checks: write

jobs:
  build-lexicon:
    name: Build & Validate Lexicon v2 Packs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Converter Unit Tests
        run: python3 -m unittest tools/lexicon_builder/test_lexicon_builder.py

      - name: Download Source SQLite Database
        run: |
          URL="${{ inputs.source_url || 'https://github.com/melonityhub/dictionaryproject/releases/download/v1.0.1/main_db.sqlite' }}"
          echo "Downloading source DB from $URL ..."
          if ! curl -fL --retry 3 -o "$RUNNER_TEMP/main_db.sqlite" "$URL"; then
            echo "Fallback to sample.sqlite from melonityhub/dictionaryproject..."
            curl -fL --retry 3 -o "$RUNNER_TEMP/main_db.sqlite" \
              "https://raw.githubusercontent.com/melonityhub/dictionaryproject/main/docs/sample.sqlite"
          fi
          ls -lh "$RUNNER_TEMP/main_db.sqlite"

      - name: Build & Validate EN->FA Lexicon Pack v2
        run: |
          python3 tools/lexicon_builder/build_lexicon.py \
            --input "$RUNNER_TEMP/main_db.sqlite" \
            --output "$RUNNER_TEMP/sublearn-lexicon-en-fa-v2.sqlite" \
            --direction en-fa \
            --gzip \
            --report "$RUNNER_TEMP/report-en-fa.json" \
            --export-test-json "$RUNNER_TEMP/sample-v2.json"
          python3 tools/lexicon_builder/validate_pack.py \
            --pack "$RUNNER_TEMP/sublearn-lexicon-en-fa-v2.sqlite" \
            --direction en-fa \
            --max-size-mb 110

      - name: Build & Validate FA->EN Dictionary Pack v1
        run: |
          python3 tools/lexicon_builder/build_lexicon.py \
            --input "$RUNNER_TEMP/main_db.sqlite" \
            --output "$RUNNER_TEMP/sublearn-dict-fa-en-v1.sqlite" \
            --direction fa-en \
            --gzip \
            --report "$RUNNER_TEMP/report-fa-en.json"
          python3 tools/lexicon_builder/validate_pack.py \
            --pack "$RUNNER_TEMP/sublearn-dict-fa-en-v1.sqlite" \
            --direction fa-en \
            --max-size-mb 110

      - name: Publish Build Report Check Run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          SUMMARY_FILE="$RUNNER_TEMP/pack-summary.md"
          {
            echo "## Lexicon Pack v2 Build Report"
            echo '### EN -> FA Pack (`sublearn-lexicon-en-fa-v2.sqlite`)'
            echo '```json'
            cat "$RUNNER_TEMP/report-en-fa.json" || true
            echo '```'
            echo '### FA -> EN Pack (`sublearn-dict-fa-en-v1.sqlite`)'
            echo '```json'
            cat "$RUNNER_TEMP/report-fa-en.json" || true
            echo '```'
          } > "$SUMMARY_FILE"
          cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
          gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name="Lexicon Pack v2 Build Report" \
            -f head_sha="$HEAD_SHA" \
            -f status=completed \
            -f conclusion=success \
            -f "output[title]=Lexicon Pack v2 Built & Validated" \
            -f "output[summary]=Full SQLite conversion and validation metrics." \
            -F "output[text]=@$SUMMARY_FILE" >/dev/null || true

      - name: Upload Pack Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sublearn-lexicon-packs-v2
          path: |
            ${{ runner.temp }}/sublearn-lexicon-en-fa-v2.sqlite.gz
            ${{ runner.temp }}/sublearn-dict-fa-en-v1.sqlite.gz
            ${{ runner.temp }}/report-en-fa.json
            ${{ runner.temp }}/report-fa-en.json
            ${{ runner.temp }}/sample-v2.json
          retention-days: 14

      - name: Publish to GitHub Release (packs-v2.0.0)
        if: ${{ github.event_name == 'push' || inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="packs-v2.0.0"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "SubLearn Offline Lexicon Packs v2.0.0" \
              --notes "Automated build of SubLearn Lexicon Pack v2 (EN->FA and FA->EN) from FastDic SQLite."
          fi
          gh release upload "$TAG" \
            "$RUNNER_TEMP/sublearn-lexicon-en-fa-v2.sqlite.gz" \
            "$RUNNER_TEMP/sublearn-dict-fa-en-v1.sqlite.gz" \
            "$RUNNER_TEMP/report-en-fa.json" \
            "$RUNNER_TEMP/report-fa-en.json" \
            --clobber
