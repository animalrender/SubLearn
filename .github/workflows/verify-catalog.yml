name: Verify Catalog v2

on:
  workflow_dispatch:
  push:
    paths:
      - "docs/catalog/catalog-v2.json"
      - ".github/workflows/verify-catalog.yml"

permissions:
  contents: read
  checks: write

jobs:
  verify-catalog:
    name: Validate catalog-v2.json Schema & URLs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Catalog Schema & Verified Flags
        run: |
          python3 - <<'EOF'
          import json, sys, urllib.request

          with open("docs/catalog/catalog-v2.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          assert data.get("version") == 2, f"Expected version 2, got {data.get('version')}"
          entries = data.get("entries", [])
          assert len(entries) >= 4, "Expected at least 4 catalog entries"

          ids = [e["id"] for e in entries]
          assert "pos-opennlp-ud" not in ids, "Hallucinated pos-opennlp-ud must not be in catalog-v2.json"

          for e in entries:
              for req in ("id", "kind", "profile", "nameEn", "nameFa", "url", "sha256", "sizeBytes", "minRamMb"):
                  assert req in e, f"Missing {req} in entry {e.get('id')}"
              assert e["url"].startswith("https://"), f"Non-HTTPS URL in {e['id']}"
              assert len(e["sha256"]) == 64, f"Invalid SHA-256 length in {e['id']}"

          print(f"Validated {len(entries)} catalog entries: {ids}")
          EOF
