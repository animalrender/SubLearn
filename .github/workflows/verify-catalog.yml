name: Verify Model Catalog

on:
  workflow_dispatch:
  push:
    branches: ["main", "phase/**", "arena/**"]
    paths:
      - "docs/catalog/catalog-v2.json"
      - ".github/workflows/verify-catalog.yml"

permissions:
  contents: read
  checks: write

jobs:
  verify-catalog:
    name: Validate catalog-v2.json Schema & URLs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Catalog must agree with the app's model table
        # Sizes, runtimes and profile placement are read from NlpModelCatalog.kt, so a catalog
        # edit that the app does not know about fails here rather than in the downloads screen.
        run: python3 tools/check_catalog.py --repo-root .

      - name: Validate Catalog Schema & Verified Flags
        run: |
          python3 - <<'EOF'
          import json

          with open("docs/catalog/catalog-v2.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          assert data.get("version") == 2, f"Expected version 2, got {data.get('version')}"
          entries = data.get("entries", [])
          assert len(entries) >= 4, "Expected at least 4 catalog entries"

          ids = [e["id"] for e in entries]
          assert "pos-opennlp-ud" not in ids, "Hallucinated pos-opennlp-ud must not be in catalog-v2.json"

          for e in entries:
              for req in ("id", "kind", "profile", "nameEn", "nameFa", "source", "sizeBytes", "minRamMb"):
                  assert req in e, f"Missing {req} in entry {e.get('id')}"
              src = e["source"]
              assert isinstance(src, dict) and src.get("url", "").startswith("https://"), f"Non-HTTPS URL in {e['id']}"
              sha = e.get("sha256")
              if sha is not None:
                  assert len(sha) == 64, f"Invalid SHA-256 length in {e['id']}"

          print(f"Validated {len(entries)} catalog entries: {ids}")
          EOF

      - name: Probe Verified Release Assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import json, urllib.request

          with open("docs/catalog/catalog-v2.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          for e in data["entries"]:
              if not e.get("verified"):
                  continue
              url = e["source"]["url"]
              if "animalrender/SubLearn/releases/download/" in url:
                  req = urllib.request.Request(url, method="HEAD", headers={"User-Agent": "SubLearn-Catalog-Verifier"})
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      print(f"Verified asset {e['id']}: HTTP {resp.status}, Content-Length={resp.headers.get('Content-Length')}")
          EOF

      - name: The catalog must describe the bytes that are actually published
        # A pack whose SHA-256 in the catalog is not the digest of the published asset can never
        # be installed: the downloader refuses it and the user only sees "SHA mismatched". The
        # release API reports the digest of every asset, so the two are compared here instead of
        # on the user's phone (§6.1).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import json, os, re, sys, urllib.request

          with open("docs/catalog/catalog-v2.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          tag_re = re.compile(r"releases/download/(?P<tag>[^/]+)/(?P<name>[^/]+)$")
          api = "https://api.github.com/repos/animalrender/SubLearn/releases/tags/{tag}"
          headers = {
              "User-Agent": "SubLearn-Catalog-Verifier",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
          }
          problems = []
          for entry in data["entries"]:
              url = entry["source"]["url"]
              match = tag_re.search(url)
              if not match:
                  continue
              tag, name = match.group("tag"), match.group("name")
              request = urllib.request.Request(api.format(tag=tag), headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  release = json.load(response)
              assets = {asset["name"]: asset for asset in release.get("assets", [])}
              asset = assets.get(name)
              if asset is None:
                  problems.append(f"{entry['id']}: {name} is not published in {tag}")
                  continue
              if asset["size"] != entry["sizeBytes"]:
                  problems.append(
                      f"{entry['id']}: catalog says {entry['sizeBytes']} bytes, the release has {asset['size']}"
                  )
              digest = (asset.get("digest") or "").removeprefix("sha256:")
              if digest and digest != entry.get("sha256"):
                  problems.append(f"{entry['id']}: catalog SHA-256 differs from the published asset")
              print(f"{entry['id']}: {name} {asset['size']} bytes, digest matches the catalog")

          if problems:
              print("CATALOG ASSET CHECK FAILED:", file=sys.stderr)
              for problem in problems:
                  print(f"  - {problem}", file=sys.stderr)
              sys.exit(1)
          print("the catalog describes the published assets")
          EOF
