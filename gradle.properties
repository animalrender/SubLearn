# The daemon heap also hosts the Kotlin compiler (`kotlin.compiler.execution.strategy=in-process`)
# and the dex mergers, and the optional engines added MediaPipe's native libraries to the graph:
# three of them ran out of room at 3 GB on a CI runner.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false
android.useAndroidX=true
# The Kotlin daemon is unreliable in the CI container (it exits during startup); in-process compilation
# costs a little throughput and buys a build that actually runs.
kotlin.compiler.execution.strategy=in-process
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
kotlin.code.style=official
