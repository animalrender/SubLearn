# Scratch (deleted before the merge): switch the app language to Persian from Settings > Appearance
# and look at the RTL layout. The language is stored in the app's own preferences, so the next flow's
# clearState brings English back.
appId: com.sublearn.app.debug
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Open a video"
    timeout: 60000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Quiz"
    timeout: 15000
- tapOn:
    text: "Settings"
    below: "Quiz"
- extendedWaitUntil:
    visible: "Search settings"
    timeout: 20000
- tapOn: "Appearance.*"
- scrollUntilVisible:
    element: "App language"
    timeout: 40000
- takeScreenshot: scratch-persian-before
# The chips are labelled with the bare tags "en" and "fa"; "My language" below has a second "fa".
- tapOn:
    text: "fa"
    below: "App language"
- extendedWaitUntil:
    visible: "باز کردن ویدیو"
    timeout: 30000
- takeScreenshot: scratch-persian-home
- tapOn: "فرهنگ لغت"
- extendedWaitUntil:
    visible: "انگلیسی ← فارسی"
    timeout: 20000
- takeScreenshot: scratch-persian-dictionary
