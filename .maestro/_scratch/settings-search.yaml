# Scratch (acceptance step 2, deleted before the merge): drive Settings by hand. Open the side menu,
# open Settings, type a search query, open the result and screenshot it. The runner dumps the
# hierarchy of the final screen (maestro/scratch-settings-search/hierarchy.json) after the flow.
appId: com.sublearn.app.debug
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Open a video"
    timeout: 60000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Quiz"
    timeout: 15000
- tapOn:
    text: "Settings"
    below: "Quiz"
- extendedWaitUntil:
    visible: "Search settings"
    timeout: 20000
- tapOn: "Search settings"
- inputText: "theme"
# "theme" is a keyword of the Appearance section, so that is the one row left.
- extendedWaitUntil:
    visible: "Appearance.*"
    timeout: 10000
- assertVisible: "theme"
- takeScreenshot: scratch-search-results
- tapOn: "Appearance.*"
- extendedWaitUntil:
    visible: "Theme"
    timeout: 20000
- takeScreenshot: scratch-search-opened-result
# The toolbar arrow has the content description "Back"; the system back key does the same. The query
# survives the trip, so the placeholder "Search settings" is hidden and the filtered row is the proof.
- tapOn: "Back"
- extendedWaitUntil:
    visible: "Appearance.*"
    timeout: 10000
- tapOn:
    text: "A button that does not exist"
    optional: true
- back
- extendedWaitUntil:
    visible: "Open a video"
    timeout: 15000
- takeScreenshot: scratch-back-on-home
