# Scratch (acceptance step 2, deleted before the merge): drive Settings by hand. Open the side menu,
# open Settings, type a search query, open the result and screenshot it. The flow ends on the opened
# result, so the hierarchy the runner dumps afterwards (maestro/scratch-settings-search/hierarchy.json
# and hierarchy-text.txt) is the hierarchy of that screen.
appId: com.sublearn.app.debug
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Open a video"
    timeout: 60000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Quiz"
    timeout: 15000
- tapOn:
    text: "Settings"
    below: "Quiz"
- extendedWaitUntil:
    visible: "Search settings"
    timeout: 20000
- tapOn: "Search settings"
- inputText: "theme"
# "theme" is a keyword of the Appearance section, so that is the one row left.
- extendedWaitUntil:
    visible: "Appearance.*"
    timeout: 10000
- assertVisible: "theme"
- takeScreenshot: scratch-search-results
- tapOn: "Appearance.*"
- extendedWaitUntil:
    visible: "Theme"
    timeout: 20000
- takeScreenshot: scratch-search-opened-result
